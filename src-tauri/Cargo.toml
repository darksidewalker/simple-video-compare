[package]
name = "dasiwa-simple-video-compare"
version = "0.3.0"
description = "DaSiWa Simple Video Compare - native desktop shell (Tauri 2)"
authors = ["DaSiWa"]
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# wry itself is not a direct dependency — tauri-runtime-wry links it.
# The vendored/patched copy in src-tauri/vendor/wry (see
# .cargo/config.toml [patch.crates-io]) is what ends up in the binary.

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libloading = "0.8"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
strip = true
